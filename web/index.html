<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sonde">
<title>Sonde</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M0 0h26l6 6v26H6l-6-6z' fill='%23000'/%3E%3Cpath d='M8 21v-8M13 24V8M18 21v-8M23 18v-2' stroke='%237df9e4' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Michroma&display=swap">
<style>
  :root {
    /* the room: plain black with neutral grey hairlines */
    --black: #000;
    --surface: #0c0c0c;
    --line: #262626;
    --line-strong: #444;
    --text: #e8e8e8;
    --muted: #8f8f8f;
    --faint: #7a7a7a;

    /* the deck hardware */
    --key-edge: #33406a;
    --vfd: #7df9e4;
    --vfd-dim: #1d4a44;
    --glass: #04110f;
    --led: #ff8a3d;
    --led-off: #4a3326;

    --deck-width: 360px;
    --chamfer: 18px;
    --mark: 10px;
    --body-font: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --mark-font: "Michroma", "Eurostile", "Bank Gothic", var(--body-font);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  [hidden] { display: none !important; }

  body {
    min-height: 100dvh;
    background: var(--black);
    color: var(--text);
    font: 400 15px/1.45 var(--body-font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--led);
    outline-offset: 2px;
  }

  svg, img { display: block; }

  /* small technical print used all over: field names, units, references */
  .micro {
    font-size: 10.5px;
    line-height: 1.2;
    letter-spacing: 0.04em;
    color: var(--faint);
  }

  /* registration marks in the four corners of a framed area */
  .marked {
    position: relative;
    background:
      linear-gradient(var(--line-strong), var(--line-strong)) top left / var(--mark) 1px no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) top left / 1px var(--mark) no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) top right / var(--mark) 1px no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) top right / 1px var(--mark) no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) bottom left / var(--mark) 1px no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) bottom left / 1px var(--mark) no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) bottom right / var(--mark) 1px no-repeat,
      linear-gradient(var(--line-strong), var(--line-strong)) bottom right / 1px var(--mark) no-repeat;
  }

  /* ---------- masthead ---------- */

  .masthead {
    max-width: 1280px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 24px 0;
  }

  .masthead-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 14px;
  }

  .ident {
    display: grid;
    gap: 6px;
  }

  .wordmark {
    margin: 0;
    font: 400 22px/1 var(--mark-font);
    letter-spacing: 0.32em;
  }

  /* readout cells: tiny field name over its value */
  .readout {
    display: flex;
    margin: 0;
  }

  .readout div {
    padding: 0 14px;
    border-left: 1px solid var(--line);
  }

  .readout div:last-child { padding-right: 0; }

  .readout dt { margin-bottom: 3px; }

  .readout dd {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
  }

  /* ruler along the bottom of the masthead */
  .ruler {
    height: 9px;
    border-top: 1px solid var(--line-strong);
    background:
      linear-gradient(90deg, var(--line-strong) 1px, transparent 1px) 0 0 / 64px 9px repeat-x,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 8px 4px repeat-x;
  }

  /* ---------- layout ---------- */

  .console {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: var(--deck-width) minmax(0, 1fr);
    gap: 32px;
    align-items: start;
  }

  /* ---------- deck ---------- */

  /* the outer layer is the outline colour and the inner one is clipped 1px
     smaller, so the outline follows the cut corners too */
  .deck {
    position: sticky;
    top: 24px;
    padding: 1px;
    background: var(--line-strong);
    clip-path: polygon(
      var(--chamfer) 0, 100% 0,
      100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%,
      0 100%, 0 var(--chamfer)
    );
  }

  .deck-inner {
    padding: 14px 20px 16px;
    background: var(--black);
    clip-path: polygon(
      calc(var(--chamfer) - 0.5px) 0, 100% 0,
      100% calc(100% - var(--chamfer) + 0.5px), calc(100% - var(--chamfer) + 0.5px) 100%,
      0 100%, 0 calc(var(--chamfer) - 0.5px)
    );
  }

  .deck-close { display: none; }

  .deck-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 10px var(--chamfer);
  }

  /* spec line above the cover: what's loaded, in numbers */
  .spec {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 8px var(--chamfer);
  }

  .spec-values {
    display: flex;
    gap: 10px;
  }

  .spec-values span + span {
    padding-left: 10px;
    border-left: 1px solid var(--line);
  }

  .cover {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* shown when a song has no cover: its initial on a hatched plate */
  .cover-blank {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: repeating-linear-gradient(135deg, var(--black) 0 6px, var(--surface) 6px 7px);
    color: var(--line-strong);
    font: 400 clamp(40px, 9vw, 96px)/1 var(--mark-font);
  }

  /* the vacuum fluorescent readout, the one bright thing on the panel */
  .vfd {
    position: relative;
    margin-top: 16px;
    padding: 14px 14px 12px;
    background: var(--glass);
    border: 1px solid #000;
    box-shadow: inset 0 0 0 1px #0d2420, inset 0 8px 24px rgb(0 0 0 / 0.6);
    color: var(--vfd);
    text-shadow: 0 0 6px rgb(125 249 228 / 0.55), 0 0 18px rgb(125 249 228 / 0.18);
    overflow: hidden;
  }

  .vfd::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgb(0 0 0 / 0.22) 0 1px, transparent 1px 3px);
  }

  .vfd-title {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vfd-artist, .vfd-album {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.78;
  }

  .vfd-album { opacity: 0.55; }

  .vfd-time {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    font-size: 13px;
  }

  .seek {
    --fill: 0%;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }

  /* segmented bar: glass-coloured gaps painted over a lit/unlit fill */
  .seek::-webkit-slider-runnable-track {
    height: 10px;
    background:
      repeating-linear-gradient(90deg, transparent 0 5px, var(--glass) 5px 7px),
      linear-gradient(90deg, var(--vfd) var(--fill), var(--vfd-dim) var(--fill));
    box-shadow: 0 0 8px rgb(125 249 228 / 0.25);
  }

  .seek::-moz-range-track {
    height: 10px;
    background:
      repeating-linear-gradient(90deg, transparent 0 5px, var(--glass) 5px 7px),
      linear-gradient(90deg, var(--vfd) var(--fill), var(--vfd-dim) var(--fill));
    box-shadow: 0 0 8px rgb(125 249 228 / 0.25);
  }

  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 3px;
    height: 16px;
    margin-top: -3px;
    background: #e9fffb;
    border: 0;
    border-radius: 0;
    box-shadow: 0 0 6px var(--vfd);
  }

  .seek::-moz-range-thumb {
    width: 3px;
    height: 16px;
    background: #e9fffb;
    border: 0;
    border-radius: 0;
    box-shadow: 0 0 6px var(--vfd);
  }

  .seek:disabled { cursor: default; }
  .seek:disabled::-webkit-slider-thumb { opacity: 0; }
  .seek:disabled::-moz-range-thumb { opacity: 0; }

  /* hardware keys */
  .keys {
    display: grid;
    grid-template-columns: 1fr 1fr 1.6fr 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }

  .key {
    position: relative;
    height: 52px;
    display: grid;
    place-items: center;
    color: var(--text);
    background: linear-gradient(to bottom, #2a3456, #1f2844);
    border: 1px solid var(--key-edge);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.07), 0 3px 0 #0a0e1b;
    transition: transform 0.05s, box-shadow 0.05s;
  }

  .key:hover { background: linear-gradient(to bottom, #303b62, #232d4c); }

  .key:active {
    transform: translateY(3px);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04), 0 0 0 #0a0e1b;
  }

  .key:disabled {
    color: var(--key-edge);
    cursor: default;
  }

  .key:disabled:active { transform: none; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.07), 0 3px 0 #0a0e1b; }

  /* indicator lamp in the corner of toggle keys and the play key */
  .key .lamp {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    background: var(--led-off);
  }

  .key[aria-pressed="true"] .lamp,
  body.playing .key-play .lamp {
    background: var(--led);
    box-shadow: 0 0 8px var(--led);
  }

  /* ---------- dials ---------- */

  /* knurled knob shared by the deck dial and the library wheel. --angle is
     set from script, .settling adds a springy ease for snaps and bounces */
  .knob {
    --angle: 0deg;
    position: absolute;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle, #1a2036 0 56%, #0c0f1c 56.5% 58%, transparent 58.5%),
      repeating-conic-gradient(#3a4672 0deg 2.2deg, #151a2c 2.2deg 5deg);
    box-shadow:
      0 0 0 1px var(--key-edge),
      inset 0 0 0 1px rgb(255 255 255 / 0.06),
      inset 0 0 24px rgb(0 0 0 / 0.55);
    transform: rotate(var(--angle));
    will-change: transform;
  }

  .knob.settling { transition: transform 0.32s cubic-bezier(0.3, 1.5, 0.5, 1); }

  /* glowing pointer line from the rim towards the centre */
  .knob::before {
    content: "";
    position: absolute;
    left: calc(50% - 1.5px);
    top: 3%;
    width: 3px;
    height: 26%;
    background: var(--vfd);
    box-shadow: 0 0 8px var(--vfd);
  }

  /* finger dimple, so it reads as something to grab */
  .knob-dimple {
    position: absolute;
    left: 50%;
    top: 33%;
    width: 13%;
    aspect-ratio: 1;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 50% 35%, #0b0e19, #222a45);
    box-shadow: inset 0 2px 3px rgb(0 0 0 / 0.7), 0 1px 0 rgb(255 255 255 / 0.06);
  }

  .tick { stroke: #333; stroke-width: 1.2; transition: stroke 0.12s; }
  .tick.major { stroke: #5a5a5a; stroke-width: 1.6; }
  .tick.near { stroke: var(--vfd-dim); }
  .tick.lit { stroke: var(--vfd); filter: drop-shadow(0 0 2px var(--vfd)); }

  /* folds the dial away. the row shrinks to nothing a frame at a time, so
     on phones the cover grows smoothly into the space it leaves */
  .dial-drawer {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.34s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.24s;
  }

  .deck.no-dial .dial-drawer {
    grid-template-rows: 0fr;
    opacity: 0;
  }

  .dial-unit {
    width: 100%;
    max-width: 260px;
    min-height: 0;
    margin: 0 auto;
    padding-top: 18px;
    overflow: hidden;
  }

  /* a full knob, cut in half by the container: only the top half shows */
  .dial {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }

  .dial.grabbing { cursor: grabbing; }
  .dial:focus-visible { outline-offset: 4px; }

  .dial-scale {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .dial .knob {
    left: 8%;
    top: 16%;
    width: 84%;
  }

  .dial.grabbing .knob, .wheel.grabbing .knob { filter: brightness(1.18); }

  /* glass readout sitting on the flat edge, over the centre of the knob */
  .dial-hub {
    position: absolute;
    left: 30%;
    bottom: 0;
    width: 40%;
    aspect-ratio: 2 / 1;
    display: grid;
    place-items: end center;
    padding-bottom: 8%;
    border-radius: 999px 999px 0 0;
    background: var(--glass);
    box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--key-edge), inset 0 6px 14px rgb(0 0 0 / 0.7);
    color: var(--vfd);
    text-shadow: 0 0 6px rgb(125 249 228 / 0.55);
    font-size: 15px;
    font-weight: 600;
    pointer-events: none;
  }

  .dial-hub span.warn { color: var(--led); text-shadow: 0 0 6px rgb(255 138 61 / 0.5); font-size: 11px; font-weight: 500; text-align: center; line-height: 1.15; }

  .pop { animation: pop 0.14s ease-out; }

  @keyframes pop {
    from { transform: scale(1.18); }
    to { transform: scale(1); }
  }

  .dial-legend {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  .dial-modes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .key-small {
    height: 34px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
  }

  .key-small[aria-pressed="true"] { color: var(--text); }

  .dial-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 22px 0 11px;
  }

  .dial-toggle .lamp { top: calc(50% - 3px); right: 8px; }

  /* library wheel: phones only, see the media query below */
  .wheel, .wheel-readout { display: none; }

  /* hidden switch Safari 18+ gives a haptic tap for when it toggles */
  .haptic-switch {
    position: fixed;
    left: -100px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* status strip under the keys: how the queue will behave */
  .status {
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr);
    margin: 16px 0 0;
    border-top: 1px solid var(--line);
  }

  .status div {
    padding: 8px 12px 0 0;
    min-width: 0;
  }

  .status div + div {
    padding-left: 12px;
    border-left: 1px solid var(--line);
  }

  .status dt { margin-bottom: 3px; }

  .status dd {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- library ---------- */

  .library {
    padding: 14px 16px 16px;
  }

  .library-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .library-head h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }

  .search {
    margin-left: auto;
    position: relative;
    width: min(320px, 100%);
  }

  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search input {
    width: 100%;
    height: 38px;
    padding: 0 12px 0 36px;
    background: var(--black);
    border: 1px solid var(--line-strong);
    border-radius: 0;
    color: var(--text);
    font: inherit;
    font-size: 16px; /* stops iOS zooming in on focus */
    outline: none;
  }

  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--vfd); }

  /* the song table: one column template shared by the header and the rows */
  .table-head, .song {
    display: grid;
    grid-template-columns: 34px 44px minmax(0, 1fr) minmax(0, 0.75fr) 40px 40px 56px;
    align-items: center;
    gap: 14px;
  }

  .table-head {
    padding: 0 10px 6px 0;
    border-bottom: 1px solid var(--line-strong);
  }

  .table-head .num, .table-head .right { text-align: right; }

  .songs {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .songs li { border-bottom: 1px solid var(--line); }

  .song {
    width: 100%;
    padding: 6px 10px 6px 0;
    text-align: left;
    position: relative;
  }

  .song:hover { background: var(--surface); }

  .song:focus-visible { outline-offset: -2px; }

  .ref {
    text-align: right;
    color: var(--faint);
    font-size: 12px;
  }

  .thumb {
    width: 44px;
    height: 44px;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb .cover-blank { font-size: 15px; }

  .song-name, .song-artist, .song-album {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-name { font-weight: 500; }

  .song-artist, .song-album {
    color: var(--muted);
    font-size: 14px;
  }

  .cell {
    color: var(--muted);
    font-size: 13px;
    text-align: right;
    white-space: nowrap;
  }

  /* the loaded song gets the amber lamp down its left edge */
  .song.active { background: rgb(255 138 61 / 0.06); }

  .song.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--led);
    box-shadow: 0 0 10px var(--led);
  }

  body:not(.playing) .song.active::before { opacity: 0.5; box-shadow: none; }

  .song.active .song-name, .song.active .ref { color: var(--led); }

  .message {
    padding: 40px 0 24px;
    color: var(--muted);
    max-width: 48ch;
  }

  .message strong {
    display: block;
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  /* ---------- compact deck bar for phones ---------- */

  .minideck { display: none; }

  @media (max-width: 1099px) {
    .table-head, .song { grid-template-columns: 34px 44px minmax(0, 1fr) minmax(0, 0.75fr) 40px 56px; }
    .col-year { display: none; }
  }

  @media (max-width: 959px) {
    .masthead { padding-left: 16px; padding-right: 16px; }

    .masthead-row {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }

    /* phones: the readout becomes a 3-across grid, and the address cell
       goes since you're already on the device it points to */
    .readout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 10px;
    }

    .readout div { padding: 0 10px; }
    .readout div:nth-child(3n + 1) { padding-left: 0; border-left: 0; }
    .readout .readout-address { display: none; }

    .console {
      display: block;
      padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
    }

    .library { padding: 12px 12px 14px; }
    .library-head { flex-wrap: wrap; }
    .search { width: 100%; }

    .table-head, .song {
      grid-template-columns: 44px minmax(0, 1fr) 40px;
      gap: 12px;
    }

    .col-ref, .col-album, .col-size { display: none; }

    /* the full deck slides up over the library */
    .deck {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow-y: auto;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      background: var(--black);
      clip-path: none;
      transform: translateY(100%);
      visibility: hidden;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s 0.28s;
    }

    .deck.open {
      transform: none;
      visibility: visible;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* everything fits on one screen: the cover takes whatever height the
       rest leaves over, and stays square inside that space */
    .deck-inner {
      display: flex;
      flex-direction: column;
      max-width: 420px;
      min-height: 100%;
      margin: 0 auto;
      padding: 0;
      clip-path: none;
    }

    .spec { margin-left: 0; }
    .deck-top { margin: -4px 0 6px; }

    .cover-slot {
      flex: 1 1 0;
      min-height: 110px;
      display: grid;
      place-items: center;
      container-type: size;
    }

    .cover { width: min(100cqw, 100cqh); }

    /* without the dial there's height to spare, so the cover runs out to
       the screen edges */
    .cover-slot { transition: margin 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .deck.no-dial .cover-slot { margin: 0 -20px; }
    .deck.no-dial .cover { border-left: 0; border-right: 0; }

    .deck-inner .vfd { margin-top: 12px; padding: 10px 12px 9px; }
    .deck-inner .vfd-title { font-size: 19px; }
    .deck-inner .vfd-time { margin-top: 8px; }
    .deck-inner .keys { margin-top: 12px; }
    .dial-unit { max-width: 250px; padding-top: 10px; }
    .dial-modes { margin-top: 8px; }
    .deck-inner .status { margin-top: 12px; }

    .deck-close {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .minideck {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 64px;
      align-items: center;
      gap: 12px;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--black);
      border-top: 1px solid var(--line-strong);
    }

    .minideck-open {
      display: contents;
      text-align: left;
    }

    .minideck .vfd {
      margin: 0;
      padding: 7px 10px;
    }

    .minideck .vfd-title { font-size: 15px; }
    .minideck .vfd-artist { font-size: 12px; }

    .minideck .key { height: 48px; }

    .mini-progress {
      position: absolute;
      left: 0;
      top: -1px;
      height: 2px;
      width: var(--fill, 0%);
      background: var(--vfd);
      box-shadow: 0 0 6px var(--vfd);
    }

    /* keep rows clear of the wheel on the right edge */
    .table-head, .songs, .message { margin-right: 72px; }

    /* the list works like a drum: the row on the focus line pops out
       towards the wheel and the rest shrink and fade with distance. script
       sets --near (0..1, falls off over a few rows) and --pop (just the
       focused row) every frame from the scroll position */
    .songs.drum .song {
      --near: 0;
      --pop: 0;
      transform-origin: 0 50%;
      transform:
        translateX(calc(var(--pop) * 8px))
        scale(calc(0.86 + var(--near) * 0.12 + var(--pop) * 0.06));
      opacity: calc(0.32 + var(--near) * 0.68);
      will-change: transform, opacity;
    }

    .songs.drum .song:hover { background: none; }

    .songs.drum .song::after {
      content: "";
      position: absolute;
      inset: 0 -6px 0 -6px;
      border: 1px solid var(--vfd);
      background: rgb(125 249 228 / 0.06);
      box-shadow: 0 0 22px rgb(125 249 228 / 0.18), inset 0 0 14px rgb(125 249 228 / 0.08);
      opacity: var(--pop);
      pointer-events: none;
    }

    .songs.drum .song .song-name { text-shadow: 0 0 calc(var(--pop) * 8px) rgb(125 249 228 / 0.5); }

    /* half a wheel sticking out of the right edge, above the deck bar */
    .wheel {
      display: block;
      position: fixed;
      right: 0;
      bottom: calc(84px + env(safe-area-inset-bottom));
      z-index: 3;
      width: 84px;
      height: 168px;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body.deck-open .wheel, body.deck-open .wheel-readout { display: none; }

    .wheel-scale {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .wheel .knob {
      left: 7px;
      top: 7px;
      width: 154px;
    }

    .wheel-hub {
      position: absolute;
      right: 0;
      top: 54px;
      width: 30px;
      height: 60px;
      display: grid;
      place-items: center;
      padding-left: 6px;
      border-radius: 999px 0 0 999px;
      background: var(--glass);
      box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--key-edge), inset 6px 0 14px rgb(0 0 0 / 0.7);
      color: var(--vfd);
      filter: drop-shadow(0 0 4px rgb(125 249 228 / 0.5));
    }

    .wheel-hub:active { color: #e9fffb; }

    /* glass label to the left of the wheel showing the highlighted song */
    .wheel-readout {
      display: block;
      position: fixed;
      right: 92px;
      bottom: calc(84px + 60px + env(safe-area-inset-bottom));
      z-index: 3;
      max-width: calc(100vw - 112px);
      margin: 0;
      padding: 8px 12px;
      opacity: 0;
      transform: translateX(8px);
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
    }

    .wheel-readout.show { opacity: 1; transform: none; }

    .wheel-readout .micro { color: var(--vfd); opacity: 0.6; margin-bottom: 2px; }
    .wheel-readout .vfd-title { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dial-drawer { transition: none; }
    .cover-slot { transition: none; }
    .deck, .deck.open { transition: none; }
    .key { transition: none; }
    .knob.settling { transition: none; }
    .pop { animation: none; }
    .wheel-readout { transition: none; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <div class="ident">
      <h1 class="wordmark">SONDE</h1>
      <span class="micro">Self-hosted music server</span>
    </div>
    <dl class="readout" id="readout">
      <div><dt class="micro">Songs</dt><dd id="stat-songs">0</dd></div>
      <div><dt class="micro">MP3</dt><dd id="stat-mp3">0</dd></div>
      <div><dt class="micro">FLAC</dt><dd id="stat-flac">0</dd></div>
      <div><dt class="micro">With covers</dt><dd id="stat-covers">0</dd></div>
      <div><dt class="micro">Library size</dt><dd id="stat-size">0 MB</dd></div>
      <div class="readout-address"><dt class="micro">Open on another device at</dt><dd id="stat-address"></dd></div>
    </dl>
  </div>
  <div class="ruler" aria-hidden="true"></div>
</header>

<div class="console">
  <section class="deck" id="deck" aria-label="Now playing">
    <div class="deck-inner">
      <div class="deck-top">
        <button class="key key-small dial-toggle" id="dial-toggle" type="button" aria-pressed="true" aria-controls="dial-drawer" title="Show or hide the dial">
          <span class="lamp"></span>
          <svg width="16" height="9" viewBox="0 0 16 9" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 8.5a7 7 0 0 1 14 0"/><path d="M8 8.5V3"/></svg>
          Dial
        </button>
        <button class="deck-close" id="deck-close" type="button">
          Back to library
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>

      <div class="spec micro">
        <span>Now playing</span>
        <span class="spec-values" id="spec"></span>
      </div>

      <div class="cover-slot"><div class="cover" id="cover"></div></div>

      <div class="vfd">
        <div class="vfd-title" id="title">Ready</div>
        <div class="vfd-artist" id="artist">Pick a song from the library</div>
        <div class="vfd-album" id="album">&nbsp;</div>
        <div class="vfd-time">
          <span id="time-current">0:00</span>
          <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position in song" disabled>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="keys">
        <button class="key" id="shuffle" type="button" aria-pressed="false" aria-label="Shuffle" title="Shuffle">
          <span class="lamp"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>
        </button>
        <button class="key" id="prev" type="button" aria-label="Previous song" title="Previous song" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h3v14H5zM20 5v14L9 12z"/></svg>
        </button>
        <button class="key key-play" id="play" type="button" aria-label="Play" title="Play (Space)" disabled>
          <span class="lamp"></span>
          <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
          <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="key" id="next" type="button" aria-label="Next song" title="Next song" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h3v14h-3zM4 5v14l11-7z"/></svg>
        </button>
        <button class="key" id="repeat" type="button" aria-pressed="false" aria-label="Repeat this song" title="Repeat this song">
          <span class="lamp"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M17 3l3 3-3 3"/><path d="M4 11V6h16M7 21l-3-3 3-3"/><path d="M20 13v5H4"/></svg>
        </button>
      </div>

      <div class="dial-drawer" id="dial-drawer">
      <div class="dial-unit">
        <div class="dial" id="dial" tabindex="0" role="slider" aria-label="Seek dial" aria-valuetext="Turn to seek">
          <svg class="dial-scale" id="dial-scale" viewBox="0 0 200 100" aria-hidden="true"></svg>
          <div class="knob" id="dial-knob"><span class="knob-dimple"></span></div>
          <div class="dial-hub"><span id="dial-readout">Seek</span></div>
        </div>
        <div class="dial-legend micro" aria-hidden="true">
          <span id="legend-left">Back</span>
          <span id="legend-right">Forward</span>
        </div>
        <div class="dial-modes">
          <button class="key key-small" id="mode-seek" type="button" aria-pressed="true" title="Dial seeks through the song">
            <span class="lamp"></span>Seek
          </button>
          <button class="key key-small" id="mode-volume" type="button" aria-pressed="false" title="Dial sets the volume">
            <span class="lamp"></span>Volume
          </button>
          <button class="key key-small" id="clicks" type="button" aria-pressed="true" title="Sounds and haptics when turning dials">
            <span class="lamp"></span>Clicks
          </button>
        </div>
      </div>
      </div>

      <dl class="status">
        <div><dt class="micro">Order</dt><dd id="status-order">In order</dd></div>
        <div><dt class="micro">Repeat</dt><dd id="status-repeat">Off</dd></div>
        <div><dt class="micro">Up next</dt><dd id="status-next">Nothing yet</dd></div>
      </dl>
    </div>
  </section>

  <main class="library marked">
    <div class="library-head">
      <h2>Library</h2>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Search songs, artists, albums" autocomplete="off" spellcheck="false" aria-label="Search the library">
      </label>
    </div>

    <div class="table-head micro" aria-hidden="true">
      <span class="num col-ref">No.</span>
      <span>Cover</span>
      <span>Title and artist</span>
      <span class="col-album">Album</span>
      <span class="right col-year">Year</span>
      <span class="right">Type</span>
      <span class="right col-size">Size</span>
    </div>
    <ol class="songs" id="songs"></ol>
    <div class="message" id="message" hidden></div>
  </main>
</div>

<div class="minideck" id="minideck">
  <div class="mini-progress" id="mini-progress"></div>
  <button class="minideck-open" id="minideck-open" type="button" aria-label="Show now playing">
    <div class="thumb" id="mini-cover"></div>
    <div class="vfd">
      <div class="vfd-title" id="mini-title">Ready</div>
      <div class="vfd-artist" id="mini-artist">Pick a song</div>
    </div>
  </button>
  <button class="key key-play" id="mini-play" type="button" aria-label="Play" disabled>
    <span class="lamp"></span>
    <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
    <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
  </button>
</div>

<div class="wheel-readout vfd" id="wheel-readout" aria-hidden="true">
  <div class="micro" id="wheel-count"></div>
  <div class="vfd-title" id="wheel-title"></div>
</div>

<div class="wheel" id="wheel" tabindex="0" role="slider" aria-label="Library dial, Enter plays the highlighted song">
  <svg class="wheel-scale" id="wheel-scale" viewBox="0 0 84 168" aria-hidden="true"></svg>
  <div class="knob" id="wheel-knob"><span class="knob-dimple"></span></div>
  <button class="wheel-hub" id="wheel-hub" type="button" data-no-drag aria-label="Play highlighted song">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
  </button>
</div>

<label class="haptic-switch" id="haptic-switch" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
const $ = (id) => document.getElementById(id);

const audio = new Audio();
audio.preload = "auto";

let songs = [];       // { file, title, artist, album, year, track, format, size, art, row }
let order = [];       // song indices in play order (shuffled or not)
let current = -1;     // index into songs
let shuffle = false;
let repeat = false;
let seeking = false;

// "Artist - Title.mp3" -> { artist, title }, used when a song has no tags
function parseFileName(file) {
  const dot = file.lastIndexOf(".");
  const base = dot > 0 ? file.slice(0, dot) : file;
  const split = base.indexOf(" - ");

  if (split > 0) {
    return { artist: base.slice(0, split), title: base.slice(split + 3) };
  }
  return { artist: "", title: base };
}

function songFromTags(tags) {
  const fallback = parseFileName(tags.file);
  const dot = tags.file.lastIndexOf(".");

  return {
    file: tags.file,
    title: tags.title || fallback.title,
    // ID3v2.3 separates several artists with "/"
    artist: (tags.artist || fallback.artist).replace(/\s*\/\s*/g, " / "),
    album: tags.album,
    year: tags.year,
    track: tags.track,
    format: dot > 0 ? tags.file.slice(dot + 1).toUpperCase() : "",
    size: tags.size,
    art: tags.art,
  };
}

const songUrl = (song) => "/songs/" + encodeURIComponent(song.file);
const artUrl = (song) => "/art/" + encodeURIComponent(song.file);

function initial(text) {
  const match = text.match(/[\p{L}\p{N}]/u);
  return match ? match[0].toUpperCase() : "?";
}

// the cover image, or a hatched plate with the song's initial
function coverElement(song) {
  if (song && song.art) {
    const img = document.createElement("img");
    img.src = artUrl(song);
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    return img;
  }
  const blank = document.createElement("div");
  blank.className = "cover-blank";
  blank.textContent = song ? initial(song.title) : "";
  return blank;
}

function albumLine(song) {
  if (song.album && song.year) {
    return `${song.album} (${song.year})`;
  }
  return song.album || song.year || "";
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) {
    return "0:00";
  }
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function formatSize(bytes) {
  if (bytes >= 1e9) {
    return `${(bytes / 1e9).toFixed(1)} GB`;
  }
  if (bytes >= 1e6) {
    return `${(bytes / 1e6).toFixed(1)} MB`;
  }
  return `${Math.ceil(bytes / 1e3)} KB`;
}

function cell(className, text) {
  const el = document.createElement("div");
  el.className = className;
  el.textContent = text;
  return el;
}

function renderSongs() {
  const list = $("songs");
  list.replaceChildren();

  songs.forEach((song, i) => {
    const li = document.createElement("li");
    const row = document.createElement("button");
    row.className = "song";
    row.type = "button";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.append(coverElement(song));

    const text = document.createElement("div");
    text.append(
      cell("song-name", song.title),
      cell("song-artist", song.artist || "Unknown artist"),
    );

    row.append(
      cell("ref col-ref", String(i + 1).padStart(3, "0")),
      thumb,
      text,
      cell("song-album col-album", song.album),
      cell("cell col-year", song.year),
      cell("cell", song.format),
      cell("cell col-size", formatSize(song.size)),
    );

    row.addEventListener("click", () => {
      if (i === current) {
        togglePlay();
      } else {
        playSong(i);
      }
    });

    li.append(row);
    list.append(li);
    song.row = row;
  });
}

function renderReadout() {
  const count = (format) => songs.filter((song) => song.format === format).length;

  $("stat-songs").textContent = songs.length;
  $("stat-mp3").textContent = count("MP3");
  $("stat-flac").textContent = count("FLAC");
  $("stat-covers").textContent = songs.filter((song) => song.art).length;
  $("stat-size").textContent = formatSize(songs.reduce((total, song) => total + song.size, 0));
}

function showMessage(title, detail) {
  const message = $("message");
  const strong = document.createElement("strong");
  strong.textContent = title;
  message.replaceChildren(strong, document.createTextNode(detail));
  message.hidden = false;
}

function applySearch() {
  const query = $("search").value.trim().toLowerCase();
  let shown = 0;

  for (const song of songs) {
    const haystack = `${song.title} ${song.artist} ${song.album} ${song.file}`.toLowerCase();
    const match = !query || haystack.includes(query);
    song.row.parentElement.hidden = !match;
    shown += match;
  }

  if (songs.length && shown === 0) {
    showMessage(`No songs match "${$("search").value.trim()}"`, "Try part of a title, artist or album.");
  } else if (songs.length) {
    $("message").hidden = true;
  }

  refreshVisible();
}

function buildOrder() {
  order = songs.map((_, i) => i);

  if (shuffle) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    // keep the current song first so "next" doesn't replay it
    if (current >= 0) {
      order.splice(order.indexOf(current), 1);
      order.unshift(current);
    }
  }
}

function nextIndex(direction) {
  const position = order.indexOf(current);
  return order[(position + direction + order.length) % order.length];
}

function updateStatus() {
  $("status-order").textContent = shuffle ? "Shuffled" : "In order";
  $("status-repeat").textContent = repeat ? "This song" : "Off";

  if (current < 0) {
    $("status-next").textContent = songs.length ? songs[order[0]].title : "Nothing yet";
  } else {
    $("status-next").textContent = repeat ? songs[current].title : songs[nextIndex(1)].title;
  }
}

function showNowPlaying(song) {
  $("cover").replaceChildren(coverElement(song));
  $("mini-cover").replaceChildren(coverElement(song));
  $("title").textContent = song.title;
  $("mini-title").textContent = song.title;
  $("artist").textContent = song.artist || "Unknown artist";
  $("mini-artist").textContent = song.artist || "Unknown artist";
  $("album").textContent = albumLine(song) || " ";
  document.title = `${song.title} | Sonde`;

  const spec = [];
  if (song.track) {
    spec.push(`Track ${song.track}`);
  }
  spec.push(song.format, formatSize(song.size));
  $("spec").replaceChildren(...spec.map((text) => {
    const span = document.createElement("span");
    span.textContent = text;
    return span;
  }));

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: song.album,
      artwork: song.art ? [{ src: new URL(artUrl(song), location.href).href }] : [],
    });
  }
}

function playSong(i) {
  const song = songs[i];
  if (!song) {
    return;
  }

  if (current >= 0) {
    songs[current].row.classList.remove("active");
  }
  current = i;
  song.row.classList.add("active");

  audio.src = songUrl(song);
  audio.play().catch(() => {});
  showNowPlaying(song);
  updateStatus();

  wheelToSong(i);

  if (dialMode === "seek" && !deckDial.busy) {
    dialReadout("Seek");
  }

  for (const id of ["play", "mini-play", "prev", "next", "seek"]) {
    $(id).disabled = false;
  }
}

function step(direction) {
  if (songs.length) {
    playSong(nextIndex(direction));
  }
}

function previous() {
  // like most players: first press restarts the song, second goes back
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else {
    step(-1);
  }
}

function togglePlay() {
  if (current < 0) {
    if (songs.length) {
      playSong(order[0]);
    }
    return;
  }
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function updatePlayState() {
  const playing = !audio.paused;
  document.body.classList.toggle("playing", playing);

  for (const key of [$("play"), $("mini-play")]) {
    // svg elements have no .hidden property, so set the attribute
    key.querySelector(".icon-play").toggleAttribute("hidden", playing);
    key.querySelector(".icon-pause").toggleAttribute("hidden", !playing);
    key.setAttribute("aria-label", playing ? "Pause" : "Play");
  }

  if ("mediaSession" in navigator) {
    navigator.mediaSession.playbackState = playing ? "playing" : "paused";
  }
}

function updateProgress() {
  const duration = audio.duration;
  const fraction = duration ? audio.currentTime / duration : 0;

  if (!seeking) {
    $("seek").value = Math.round(fraction * 1000);
    $("seek").style.setProperty("--fill", `${fraction * 100}%`);
    $("time-current").textContent = formatTime(audio.currentTime);
  }
  $("mini-progress").style.setProperty("--fill", `${fraction * 100}%`);
  $("time-total").textContent = formatTime(duration);
}

function setDeckOpen(open) {
  $("deck").classList.toggle("open", open);
  document.body.classList.toggle("deck-open", open);
  if (open) {
    $("deck-close").focus();
  }
}

// ---------- wiring ----------

audio.addEventListener("play", updatePlayState);
audio.addEventListener("pause", updatePlayState);
audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("loadedmetadata", updateProgress);
audio.addEventListener("ended", () => {
  if (repeat) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } else {
    step(1);
  }
});
audio.addEventListener("error", () => {
  if (current >= 0) {
    $("title").textContent = "Can't play this song";
    $("artist").textContent = songs[current].file;
  }
});

$("play").addEventListener("click", togglePlay);
$("mini-play").addEventListener("click", togglePlay);
$("next").addEventListener("click", () => step(1));
$("prev").addEventListener("click", previous);

$("shuffle").addEventListener("click", () => {
  shuffle = !shuffle;
  $("shuffle").setAttribute("aria-pressed", shuffle);
  buildOrder();
  updateStatus();
});

$("repeat").addEventListener("click", () => {
  repeat = !repeat;
  $("repeat").setAttribute("aria-pressed", repeat);
  updateStatus();
});

$("seek").addEventListener("input", () => {
  seeking = true;
  const fraction = $("seek").value / 1000;
  $("seek").style.setProperty("--fill", `${fraction * 100}%`);
  $("time-current").textContent = formatTime(fraction * (audio.duration || 0));
});

$("seek").addEventListener("change", () => {
  if (audio.duration) {
    audio.currentTime = ($("seek").value / 1000) * audio.duration;
  }
  seeking = false;
});

$("search").addEventListener("input", applySearch);
$("minideck-open").addEventListener("click", () => setDeckOpen(true));
$("deck-close").addEventListener("click", () => setDeckOpen(false));

document.addEventListener("keydown", (event) => {
  const typing = event.target.matches("input[type=search]");

  if (event.key === "Escape" && $("deck").classList.contains("open")) {
    setDeckOpen(false);
  } else if (event.key === "/" && !typing) {
    event.preventDefault();
    $("search").focus();
  } else if (event.key === "Escape" && typing) {
    $("search").value = "";
    applySearch();
    $("search").blur();
  } else if (typing || event.target.matches("button, input, [role=slider]")) {
    return;
  } else if (event.key === " ") {
    event.preventDefault();
    togglePlay();
  } else if (event.key === "ArrowRight" && audio.duration) {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
  } else if (event.key === "ArrowLeft" && audio.duration) {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  }
});

// lock screen and headphone buttons on phones
if ("mediaSession" in navigator) {
  const handlers = {
    play: () => audio.play(),
    pause: () => audio.pause(),
    previoustrack: previous,
    nexttrack: () => step(1),
    seekto: (details) => { audio.currentTime = details.seekTime; },
  };
  for (const [action, handler] of Object.entries(handlers)) {
    try {
      navigator.mediaSession.setActionHandler(action, handler);
    } catch {
      // older browsers don't know every action
    }
  }
}

// ---------- clicks: little synthesised sounds and haptic taps ----------

function loadSetting(key, fallback) {
  try {
    return localStorage.getItem(key) ?? fallback;
  } catch {
    return fallback;
  }
}

function saveSetting(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    // private browsing can refuse storage, the setting just won't stick
  }
}

const clicks = {
  on: loadSetting("sonde-clicks", "on") === "on",
  ctx: null,
  out: null,
  lastTick: 0,
  lastTap: 0,

  // made on first use, browsers only allow audio after a touch or click
  context() {
    if (!this.on) {
      return null;
    }
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.9;
        this.out.connect(this.ctx.destination);
      } catch {
        return null;
      }
    }
    if (this.ctx.state === "suspended") {
      this.ctx.resume();
    }
    return this.ctx;
  },

  // one short tone sliding from one pitch to another with a fast fade
  blip(from, to, seconds, type, gain, delay = 0) {
    const ctx = this.context();
    if (!ctx) {
      return;
    }
    const start = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(from, start);
    osc.frequency.exponentialRampToValueAtTime(to, start + seconds);
    env.gain.setValueAtTime(0.0001, start);
    env.gain.exponentialRampToValueAtTime(gain, start + 0.003);
    env.gain.exponentialRampToValueAtTime(0.0001, start + seconds);

    osc.connect(env).connect(this.out);
    osc.start(start);
    osc.stop(start + seconds + 0.02);
  },

  // detent click, pitch 0.7 to 1.5. fast spins skip some so it stays a purr, not a buzz
  tick(pitch = 1) {
    const now = performance.now();
    if (now - this.lastTick < 28) {
      return;
    }
    this.lastTick = now;
    this.blip(2300 * pitch, 1400 * pitch, 0.03, "triangle", 0.085);
    this.tap(6);
  },

  grab() {
    this.blip(210, 110, 0.07, "sine", 0.16);
    this.tap(10);
  },

  settle() {
    this.blip(150, 90, 0.06, "sine", 0.09);
  },

  // hit an end stop
  bump() {
    this.blip(95, 50, 0.12, "sine", 0.22);
    this.blip(900, 600, 0.03, "triangle", 0.055);
    this.tap(22);
  },

  confirm() {
    this.blip(660, 990, 0.09, "sine", 0.1);
    this.blip(990, 1320, 0.08, "sine", 0.07, 0.06);
    this.tap(14);
  },

  tap(ms) {
    const now = performance.now();
    if (!this.on || now - this.lastTap < 35) {
      return;
    }
    this.lastTap = now;

    if (navigator.vibrate) {
      navigator.vibrate(ms);
    } else {
      // iPhone Safari has no vibrate, but taps when a switch toggles
      $("haptic-switch").click();
    }
  },
};

// ---------- dials ----------

const RAD = Math.PI / 180;

// lines around an arc, angles in screen degrees (0 = right, 90 = down)
function drawScale(svg, { cx, cy, inner, outer, from, to, step, major }) {
  const ticks = [];

  for (let angle = from; angle <= to + 0.001; angle += step) {
    const isMajor = Math.round(angle - from) % major === 0;
    const start = isMajor ? inner - 3 : inner;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

    line.setAttribute("x1", cx + start * Math.cos(angle * RAD));
    line.setAttribute("y1", cy + start * Math.sin(angle * RAD));
    line.setAttribute("x2", cx + outer * Math.cos(angle * RAD));
    line.setAttribute("y2", cy + outer * Math.sin(angle * RAD));
    line.setAttribute("class", isMajor ? "tick major" : "tick");
    svg.append(line);
    ticks.push({ angle, line, major: isMajor });
  }
  return ticks;
}

// light the tick under the knob's pointer, and dimly its neighbours
function lightPointer(ticks, pointer, step) {
  for (const tick of ticks) {
    const off = Math.abs(((tick.angle - pointer + 540) % 360) - 180);
    tick.line.setAttribute("class", `tick${tick.major ? " major" : ""}${off < step / 2 ? " lit" : off < step * 1.5 ? " near" : ""}`);
  }
}

// a knob you drag round in a circle. it reports every detent it clicks
// past, coasts after a flick, and stretches then springs back past its ends
class Dial {
  constructor(el, knob, options) {
    this.el = el;
    this.knob = knob;
    this.o = options;
    this.value = 0;      // degrees, kept inside the limits
    this.raw = 0;        // where the finger pushed it, can go past the limits
    this.velocity = 0;   // degrees per millisecond
    this.detentIndex = 0;
    this.pointer = null;
    this.frame = 0;
    this.coasting = false;
    this.gliding = false;
    this.overLimit = false;
    this.visual = 0;     // the angle last drawn, rubber band stretch included

    el.addEventListener("pointerdown", (e) => this.grab(e));
    el.addEventListener("pointermove", (e) => this.drag(e));
    el.addEventListener("pointerup", (e) => this.release(e));
    el.addEventListener("pointercancel", (e) => this.release(e));
  }

  // being held or still coasting from a flick
  get busy() { return this.pointer !== null || this.coasting; }

  get detent() { return this.o.detent(); }
  get min() { return this.o.min ? this.o.min() : -Infinity; }
  get max() { return this.o.max ? this.o.max() : Infinity; }

  fingerAngle(e) {
    const centre = this.o.centre(this.el.getBoundingClientRect());
    const dx = e.clientX - centre.x;
    const dy = e.clientY - centre.y;
    return { angle: Math.atan2(dy, dx) / RAD, distance: Math.hypot(dx, dy) };
  }

  grab(e) {
    if (e.button !== 0 || e.target.closest("[data-no-drag]")) {
      return;
    }
    if (this.o.enabled && !this.o.enabled()) {
      this.o.onRefuse?.();
      return;
    }

    cancelAnimationFrame(this.frame);
    if (this.gliding) {
      // caught mid-glide: pick it up where it is drawn, not where it was headed
      this.gliding = false;
      this.value = Math.min(this.max, Math.max(this.min, this.visual));
      this.detentIndex = Math.round(this.value / this.detent);
    }
    try {
      // keep getting moves even when the finger slides off the dial
      this.el.setPointerCapture(e.pointerId);
    } catch {
      // the pointer is already gone, the drag just ends early
    }
    this.pointer = { id: e.pointerId, angle: this.fingerAngle(e).angle, time: e.timeStamp };
    this.velocity = 0;
    this.raw = this.value;
    this.knob.classList.remove("settling");
    this.el.classList.add("grabbing");
    this.o.onGrab?.();
  }

  drag(e) {
    if (!this.pointer || e.pointerId !== this.pointer.id) {
      return;
    }

    const finger = this.fingerAngle(e);

    // too close to the centre to tell which way it's turning
    if (finger.distance < 12) {
      return;
    }

    const delta = ((finger.angle - this.pointer.angle + 540) % 360) - 180;
    const dt = Math.max(1, e.timeStamp - this.pointer.time);

    this.velocity = this.velocity * 0.6 + (delta / dt) * 0.4;
    this.pointer.angle = finger.angle;
    this.pointer.time = e.timeStamp;
    this.turn(delta);
  }

  release(e) {
    if (!this.pointer || e.pointerId !== this.pointer.id) {
      return;
    }
    this.pointer = null;
    this.el.classList.remove("grabbing");

    // a flick keeps spinning, a slow let go settles where it is
    if (Math.abs(this.velocity) > 0.06 && !this.overLimit) {
      this.coast();
    } else {
      this.settle();
    }
  }

  turn(delta) {
    const min = this.min;
    const max = this.max;

    // limit how far past an end it can be dragged, so coming back is quick
    this.raw = Math.min(max + 60, Math.max(min - 60, this.raw + delta));
    this.value = Math.min(max, Math.max(min, this.raw));

    const over = this.raw - this.value;

    if (over !== 0 && !this.overLimit) {
      this.overLimit = true;
      this.o.onLimit?.(Math.sign(over));
    } else if (over === 0) {
      this.overLimit = false;
    }

    const index = Math.round(this.value / this.detent);

    if (index !== this.detentIndex) {
      const steps = index - this.detentIndex;
      this.detentIndex = index;
      this.o.onDetent?.(steps, index);
    }

    // past an end it stretches like a rubber band
    this.render(this.value + Math.sign(over) * Math.min(16, Math.abs(over) * 0.3));
  }

  coast() {
    let last = performance.now();
    this.coasting = true;

    const step = (now) => {
      const dt = Math.min(32, now - last);
      last = now;
      this.velocity *= Math.pow(this.o.friction, dt);
      this.turn(this.velocity * dt);

      if (this.overLimit || Math.abs(this.velocity) < 0.01) {
        this.settle();
        return;
      }
      this.frame = requestAnimationFrame(step);
    };
    this.frame = requestAnimationFrame(step);
  }

  // spring back from past an end and click into the nearest detent.
  // with the glide option it eases there instead, drawing every frame so
  // whatever follows the dial moves smoothly too
  settle() {
    cancelAnimationFrame(this.frame);
    this.coasting = false;
    this.velocity = 0;
    this.overLimit = false;

    if (this.o.glide) {
      this.glideTo(this.detentIndex * this.detent, () => this.o.onSettle?.());
      return;
    }
    this.value = this.raw = this.detentIndex * this.detent;
    this.knob.classList.add("settling");
    this.render(this.value);
    this.o.onSettle?.();
  }

  glideTo(target, done) {
    cancelAnimationFrame(this.frame);
    const from = this.visual;
    const start = performance.now();
    const length = Math.min(520, 220 + Math.abs(target - from) * 2);

    this.value = this.raw = target;
    this.detentIndex = Math.round(target / this.detent);
    this.gliding = true;
    this.knob.classList.remove("settling");

    const step = (now) => {
      const t = Math.min(1, (now - start) / length);
      const eased = 1 - Math.pow(1 - t, 3);
      this.render(from + (target - from) * eased);

      if (t < 1) {
        this.frame = requestAnimationFrame(step);
      } else {
        this.gliding = false;
        done?.();
      }
    };
    this.frame = requestAnimationFrame(step);
  }

  setValue(value, animate) {
    if (animate && this.o.glide) {
      this.glideTo(value);
      return;
    }
    cancelAnimationFrame(this.frame);
    this.gliding = false;
    this.value = this.raw = value;
    this.detentIndex = Math.round(value / this.detent);
    this.knob.classList.toggle("settling", animate);
    this.render(value);
  }

  render(visual) {
    this.visual = visual;
    this.knob.style.setProperty("--angle", `${visual + (this.o.offset || 0)}deg`);
    this.o.onRender?.(visual);
  }
}

// ---------- deck dial: seek or volume ----------

const volumeWorks = (() => {
  // iPhone Safari ignores volume changes from web pages
  const probe = new Audio();
  probe.volume = 0.5;
  return probe.volume === 0.5;
})();

let dialMode = "seek";
let seekAngle = 0;        // where the knob was left in seek mode
let seekFrom = 0;         // song position when the dial was grabbed
let seekTo = 0;           // where letting go will jump to
let seekAtEnd = false;

const VOLUME_DETENT = 9;  // 20 steps of 5% across the half circle
const SEEK_DETENT = 5;

const dialTicks = drawScale($("dial-scale"), {
  cx: 100, cy: 100, inner: 88, outer: 96, from: -180, to: 0, step: 5, major: 45,
});

function signedTime(seconds) {
  return `${seconds < 0 ? "-" : "+"}${formatTime(Math.abs(seconds))}`;
}

function dialReadout(text, warn = false) {
  const el = $("dial-readout");
  el.textContent = text;
  el.classList.toggle("warn", warn);
  el.classList.remove("pop");
  void el.offsetWidth; // restart the pop animation
  el.classList.add("pop");
}

function setVolume(level) {
  audio.volume = level;
  saveSetting("sonde-volume", String(level));
  $("dial").setAttribute("aria-valuetext", `Volume ${Math.round(level * 100)}%`);
}

const deckDial = new Dial($("dial"), $("dial-knob"), {
  centre: (r) => ({ x: r.left + r.width / 2, y: r.bottom }),
  detent: () => (dialMode === "volume" ? VOLUME_DETENT : SEEK_DETENT),
  min: () => (dialMode === "volume" ? -90 : -Infinity),
  max: () => (dialMode === "volume" ? 90 : Infinity),
  friction: 0.994,

  enabled: () => (dialMode === "volume" ? volumeWorks : current >= 0 && isFinite(audio.duration)),

  onRefuse() {
    clicks.bump();
    dialReadout(dialMode === "volume" ? "Use side buttons" : "Pick a song", true);
  },

  onGrab() {
    clicks.grab();
    if (dialMode === "seek") {
      seeking = true;
      seekFrom = seekTo = audio.currentTime;
      seekAtEnd = false;
      dialReadout(signedTime(0));
    }
  },

  onDetent(steps, index) {
    if (dialMode === "volume") {
      const level = (index * VOLUME_DETENT + 90) / 180;
      setVolume(level);
      dialReadout(`${Math.round(level * 100)}%`);
      clicks.tick(0.7 + level * 0.8);
      return;
    }

    // jog wheel: the faster it spins, the further each click jumps
    const perClick = Math.min(10, Math.max(1, Math.round(Math.abs(deckDial.velocity) * 12)));
    const duration = audio.duration;
    const target = Math.min(duration - 0.5, Math.max(0, seekTo + steps * perClick));
    const atEnd = target === 0 || target === duration - 0.5;

    if (atEnd && !seekAtEnd) {
      clicks.bump();
    } else if (!atEnd) {
      clicks.tick(0.75 + (target / duration) * 0.7);
    }
    seekAtEnd = atEnd;
    seekTo = target;

    // preview the jump on the timeline, the real seek happens on let go
    const fraction = target / duration;
    $("seek").value = Math.round(fraction * 1000);
    $("seek").style.setProperty("--fill", `${fraction * 100}%`);
    $("time-current").textContent = formatTime(target);
    dialReadout(signedTime(target - seekFrom));
  },

  onLimit() {
    clicks.bump();
  },

  onSettle() {
    clicks.settle();
    if (dialMode === "seek" && seeking) {
      if (seekTo !== seekFrom) {
        audio.currentTime = seekTo;
      }
      seeking = false;
      $("dial").setAttribute("aria-valuetext", `At ${formatTime(seekTo)}`);
    }
  },

  onRender(visual) {
    if (dialMode === "volume") {
      // level meter: everything up to the pointer is lit
      for (const tick of dialTicks) {
        const lit = tick.angle <= visual - 90 + 0.001;
        tick.line.setAttribute("class", `tick${tick.major ? " major" : ""}${lit ? " lit" : ""}`);
      }
    } else {
      lightPointer(dialTicks, visual - 90, 5);
    }
  },
});

function setDialMode(mode) {
  if (mode === dialMode) {
    return;
  }
  if (dialMode === "seek") {
    seekAngle = deckDial.value;
  }
  dialMode = mode;

  $("mode-seek").setAttribute("aria-pressed", mode === "seek");
  $("mode-volume").setAttribute("aria-pressed", mode === "volume");
  $("legend-left").textContent = mode === "volume" ? "Quiet" : "Back";
  $("legend-right").textContent = mode === "volume" ? "Loud" : "Forward";
  $("dial").setAttribute("aria-label", mode === "volume" ? "Volume dial" : "Seek dial");

  clicks.tick(1.2);

  if (mode === "volume") {
    if (volumeWorks) {
      deckDial.setValue(audio.volume * 180 - 90, true);
      dialReadout(`${Math.round(audio.volume * 100)}%`);
    } else {
      deckDial.setValue(90, true);
      dialReadout("Use side buttons", true);
    }
  } else {
    deckDial.setValue(seekAngle, true);
    dialReadout("Seek");
  }
}

$("mode-seek").addEventListener("click", () => setDialMode("seek"));
$("mode-volume").addEventListener("click", () => setDialMode("volume"));

$("clicks").addEventListener("click", () => {
  clicks.on = !clicks.on;
  $("clicks").setAttribute("aria-pressed", clicks.on);
  saveSetting("sonde-clicks", clicks.on ? "on" : "off");
  clicks.confirm();
});

function setDialShown(shown) {
  $("deck").classList.toggle("no-dial", !shown);
  $("dial-toggle").setAttribute("aria-pressed", shown);
  // nothing in a folded drawer should take focus
  $("dial-drawer").inert = !shown;
  saveSetting("sonde-dial", shown ? "shown" : "hidden");
}

$("dial-toggle").addEventListener("click", () => {
  setDialShown($("deck").classList.contains("no-dial"));
  clicks.confirm();
});

// arrow keys turn the dial one step for keyboard users
$("dial").addEventListener("keydown", (event) => {
  const direction = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[event.key];
  if (!direction) {
    return;
  }
  event.preventDefault();

  if (dialMode === "volume" && volumeWorks) {
    const level = Math.min(1, Math.max(0, Math.round(audio.volume * 20 + direction) / 20));
    setVolume(level);
    deckDial.setValue(level * 180 - 90, true);
    dialReadout(`${Math.round(level * 100)}%`);
    clicks.tick(0.7 + level * 0.8);
  } else if (dialMode === "seek" && current >= 0 && audio.duration) {
    audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + direction * 5));
    deckDial.setValue(deckDial.value + direction * SEEK_DETENT, true);
    dialReadout(signedTime(direction * 5));
    clicks.tick(1);
  }
});

// ---------- library wheel and drum list (phones) ----------

// the page's scroll position is the one source of truth: turning the wheel
// scrolls the page, scrolling with a finger turns the wheel, and whichever
// row sits on the focus line pops out

const WHEEL_DETENT = 15;
const phone = matchMedia("(max-width: 959px)");
let visible = [];         // indices of the songs the search lets through
let centres = [];         // page y of the middle of each visible row
let focusLine = 0;        // how far down the window the focused row sits
let cursor = -1;          // the visible row nearest the focus line
let drawn = new Set();    // rows drawDrum has styled
let followingScroll = false;
let lastFingerScroll = -Infinity;
let wheelHideTimer = 0;

const wheelTicks = drawScale($("wheel-scale"), {
  cx: 84, cy: 84, inner: 79, outer: 83, from: 95, to: 265, step: 10, major: 30,
});

// where each row is, measured from layout so the drum's scaling doesn't
// count. also pads the list so the last row can reach the focus line
function measureRows() {
  const list = $("songs");
  list.style.paddingBottom = "";
  list.classList.toggle("drum", phone.matches);
  centres = [];

  if (!phone.matches || !visible.length) {
    return;
  }

  const listTop = list.getBoundingClientRect().top + scrollY;
  centres = visible.map((i) => {
    const li = songs[i].row.parentElement;
    return listTop + li.offsetTop - list.offsetTop + li.offsetHeight / 2;
  });

  // a bit above the middle of what the deck bar leaves, but never lower
  // than the first row already is, or it could never be focused
  const bottom = innerHeight - $("minideck").offsetHeight;
  focusLine = Math.min(bottom * 0.45, centres[0]);

  const short = centres.at(-1) - focusLine + innerHeight - document.documentElement.scrollHeight;
  if (short > 0) {
    list.style.paddingBottom = `${Math.ceil(short)}px`;
  }
}

// page y on the focus line to a fractional row, and back
function rowAt(y) {
  const last = centres.length - 1;
  if (y <= centres[0]) {
    return 0;
  }
  if (y >= centres[last]) {
    return last;
  }
  let lo = 0;
  let hi = last;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (centres[mid] <= y) {
      lo = mid;
    } else {
      hi = mid;
    }
  }
  return lo + (y - centres[lo]) / (centres[hi] - centres[lo]);
}

function centreOf(row) {
  const i = Math.floor(row);
  if (i >= centres.length - 1) {
    return centres.at(-1);
  }
  return centres[i] + (centres[i + 1] - centres[i]) * (row - i);
}

// size every row near the focus by how far it is from it, in rows
function drawDrum(row) {
  const near = new Set();
  const first = Math.max(0, Math.floor(row) - 5);
  const last = Math.min(visible.length - 1, Math.ceil(row) + 5);

  for (let k = first; k <= last; k++) {
    const el = songs[visible[k]].row;
    const distance = Math.abs(k - row);
    const pop = Math.max(0, 1 - distance / 0.8);

    el.style.setProperty("--near", (1 / (1 + 1.4 * distance * distance)).toFixed(3));
    el.style.setProperty("--pop", (pop * pop * (3 - 2 * pop)).toFixed(3));
    near.add(el);
  }

  for (const el of drawn) {
    if (!near.has(el)) {
      el.style.removeProperty("--near");
      el.style.removeProperty("--pop");
    }
  }
  drawn = near;
  setCursor(Math.round(row));
}

function scrollToRow(row) {
  const clamped = Math.min(visible.length - 1, Math.max(0, row));
  window.scrollTo({ top: centreOf(clamped) - focusLine, behavior: "instant" });
  drawDrum(clamped);
}

function setCursor(position) {
  position = Math.min(visible.length - 1, Math.max(0, position));
  if (position === cursor || !visible.length) {
    return;
  }
  cursor = position;

  const song = songs[visible[cursor]];
  $("wheel-count").textContent = `${String(cursor + 1).padStart(3, "0")} of ${String(visible.length).padStart(3, "0")}`;
  $("wheel-title").textContent = song.title;
  $("wheel").setAttribute("aria-valuetext", `${song.title}, ${cursor + 1} of ${visible.length}`);
}

function wheelClick(position) {
  // pitch climbs as you go down the list
  clicks.tick(0.75 + (position / Math.max(1, visible.length - 1)) * 0.6);
}

function showWheelReadout() {
  clearTimeout(wheelHideTimer);
  $("wheel-readout").classList.add("show");
}

function hideWheelReadoutSoon() {
  clearTimeout(wheelHideTimer);
  wheelHideTimer = setTimeout(() => $("wheel-readout").classList.remove("show"), 1100);
}

// turn the wheel to match the page without scrolling it again
function followScroll() {
  if (!centres.length) {
    return;
  }
  const row = rowAt(scrollY + focusLine);
  drawDrum(row);
  followingScroll = true;
  wheel.setValue(-row * WHEEL_DETENT, false);
  followingScroll = false;
}

// keep the wheel's list in step with the search box
function refreshVisible() {
  visible = songs.map((_, i) => i).filter((i) => !songs[i].row.parentElement.hidden);
  cursor = -1;
  measureRows();
  wheel.setValue(0, false);
  if (!centres.length) {
    setCursor(0);
  }
}

const wheel = new Dial($("wheel"), $("wheel-knob"), {
  centre: (r) => ({ x: r.right, y: r.top + r.height / 2 }),
  detent: () => WHEEL_DETENT,
  // dragging down along the wheel turns it anticlockwise, which moves down the list
  min: () => -(Math.max(1, visible.length) - 1) * WHEEL_DETENT,
  max: () => 0,
  offset: -90,
  friction: 0.996,
  glide: true,
  enabled: () => visible.length > 0,

  onRefuse() {
    clicks.bump();
  },

  onGrab() {
    clicks.grab();
    showWheelReadout();
  },

  onDetent(steps, index) {
    wheelClick(-index);
  },

  onLimit() {
    clicks.bump();
  },

  onSettle() {
    clicks.settle();
    hideWheelReadoutSoon();
  },

  onRender(visual) {
    lightPointer(wheelTicks, visual + 180, 10);
    if (!followingScroll && centres.length) {
      scrollToRow(-visual / WHEEL_DETENT);
    }
  },
});

addEventListener("scroll", () => {
  // scrolls the wheel caused itself are already drawn
  if (wheel.busy || wheel.gliding) {
    return;
  }
  lastFingerScroll = performance.now();
  followScroll();
}, { passive: true });

let resizeFrame = 0;
addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    measureRows();
    followScroll();
  });
});
document.fonts?.ready.then(() => {
  measureRows();
  followScroll();
});

// the wheel follows whatever starts playing, unless you're using the list
function wheelToSong(i) {
  const position = visible.indexOf(i);
  if (position >= 0 && !wheel.busy && performance.now() - lastFingerScroll > 1200) {
    wheel.setValue(-position * WHEEL_DETENT, true);
  }
}

$("wheel-hub").addEventListener("click", () => {
  if (visible.length) {
    clicks.confirm();
    playSong(visible[cursor]);
  }
});

$("wheel").addEventListener("keydown", (event) => {
  const direction = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[event.key];

  if (direction && visible.length) {
    event.preventDefault();
    const position = Math.min(visible.length - 1, Math.max(0, cursor + direction));
    wheelClick(position);
    wheel.setValue(-position * WHEEL_DETENT, true);
  } else if (event.key === "Enter" && visible.length) {
    event.preventDefault();
    clicks.confirm();
    playSong(visible[cursor]);
  }
});

async function loadSongs() {
  try {
    const response = await fetch("/api/songs");
    if (!response.ok) {
      throw new Error(response.status);
    }

    songs = (await response.json()).map(songFromTags);
    renderSongs();
    renderReadout();
    buildOrder();
    updateStatus();
    refreshVisible();

    // play works before anything is picked, it starts the first song
    $("play").disabled = $("mini-play").disabled = !songs.length;

    if (!songs.length) {
      showMessage("This folder has no songs yet", "Add .mp3 or .flac files to it, then reload this page.");
    }
  } catch {
    showMessage("Can't reach the Sonde server", "Check that sonded is still running, then reload this page.");
  }
}

if (volumeWorks) {
  audio.volume = Number(loadSetting("sonde-volume", "1")) || 0;
}
$("clicks").setAttribute("aria-pressed", clicks.on);
deckDial.setValue(0, false);
setDialShown(loadSetting("sonde-dial", "shown") === "shown");
wheel.setValue(0, false);

$("stat-address").textContent = location.host;
$("cover").append(coverElement(null));
$("mini-cover").append(coverElement(null));
loadSongs();

// lets the browser offer to install Sonde as an app. only allowed over
// https or on localhost, so on plain http over wifi this quietly does nothing
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
